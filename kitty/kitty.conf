# === Fonts ===
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

# === Window Look ===
background_opacity   0.88
background_blur      10
cursor_shape         beam
cursor_blink_interval 0.5
enable_audio_bell    no

# === Tabs ===
tab_bar_edge         bottom
tab_bar_style        powerline
tab_powerline_style  slanted
active_tab_font_style bold
inactive_tab_font_style normal

# Keybinds for splits & tabs
map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+minus launch --location=vsplit
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_tab
map ctrl+shift+arrow move_tab

# === Colors (TokyoNight Style) ===
foreground           #d6e4ff
background           #0a0a12
selection_foreground #0a0a12
selection_background #46d9ff
cursor               #ff2a6d

color0   #0a0a12
color1   #ff2a6d
color2   #05ffa1
color3   #f9f002
color4   #46d9ff
color5   #b967ff
color6   #01cdfe
color7   #d6e4ff
color8   #5a6078
color9   #ff5c8a
color10  #3dffb8
color11  #fff95c
color12  #7fe6ff
color13  #d09bff
color14  #5fe0ff
color15  #ffffff

# === Performance Tweaks ===
repaint_delay        8
input_delay          2
sync_to_monitor      yes

# === Misc ===
confirm_os_window_close 0