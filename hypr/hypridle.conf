# hypridle (read by hypridle itself, not by the Lua Hyprland config; started from autostart.lua)
# Apps that inhibit idle (video in Firefox, games...) keep it from firing.

general {
    lock_cmd         = pidof hyprlock || hyprlock           # run on `loginctl lock-session` (SUPER+CTRL+L)
    before_sleep_cmd = loginctl lock-session                # lock before suspend
    after_sleep_cmd  = ~/.config/hypr/scripts/dpms.sh on
}

# 5 min: cyberpunk screensaver on every monitor (the wallpaper, animated by a GPU shader); any input stops it
listener {
    timeout    = 300
    on-timeout = ~/.config/hypr/scripts/screensaver.sh start
    on-resume  = ~/.config/hypr/scripts/screensaver.sh stop
}

# 10 min: lock the session (the lock screen sits above the screensaver)
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 15 min: screens off
listener {
    timeout    = 900
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume  = ~/.config/hypr/scripts/dpms.sh on
}
