# hyprlock (hyprlang, read by hyprlock itself). Started by hypridle (lock_cmd) or SUPER+CTRL+L.
# Palette: bg #0a0a12, cyan #46d9ff, magenta #ff2a6d, yellow #f9f002, text #d6e4ff.

general {
    hide_cursor = true
}

# One wallpaper per monitor, the same images as the desktop, dimmed and blurred.
background {
    monitor    = DP-2
    path       = ~/.local/share/wallpapers/main.png
    blur_passes = 3
    blur_size  = 6
    brightness = 0.55
}

background {
    monitor    = DP-3
    path       = ~/.local/share/wallpapers/second.jpg
    blur_passes = 3
    blur_size  = 6
    brightness = 0.55
}

# Clock
label {
    monitor     = 
    text        = $TIME
    color       = rgba(249, 240, 2, 1.0)
    font_size   = 96
    font_family = Orbitron
    position    = 0, 160
    halign      = center
    valign      = center
}

# Date
label {
    monitor     = 
    text        = cmd[update:60000] date +"%A %d %B"
    color       = rgba(214, 228, 255, 1.0)
    font_size   = 22
    font_family = Orbitron
    position    = 0, 70
    halign      = center
    valign      = center
}

# Tag, same style as the bar
label {
    monitor     = 
    text        = cmd[update:3600000] echo "$(hostname | tr a-z A-Z)// LOCKED"
    color       = rgba(255, 42, 109, 1.0)
    font_size   = 14
    font_family = Orbitron
    position    = 0, -110
    halign      = center
    valign      = center
}

input-field {
    monitor           = 
    size              = 340, 52
    outline_thickness = 3
    dots_size         = 0.25
    dots_spacing      = 0.35
    dots_center       = true
    outer_color       = rgba(70, 217, 255, 1.0)
    inner_color       = rgba(10, 10, 18, 0.85)
    font_color        = rgba(214, 228, 255, 1.0)
    check_color       = rgba(249, 240, 2, 1.0)
    fail_color        = rgba(255, 42, 109, 1.0)
    capslock_color    = rgba(249, 240, 2, 1.0)
    fade_on_empty     = false
    rounding          = 0
    placeholder_text  = <span foreground="##5a6078">PASSWORD</span>
    fail_text         = <span foreground="##ff2a6d">ACCESS DENIED</span>
    position          = 0, -30
    halign            = center
    valign            = center
}
